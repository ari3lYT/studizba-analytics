services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: studizba
      POSTGRES_USER: studizba
      POSTGRES_PASSWORD: studizba_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - studizba_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studizba -d studizba"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  studizba_pg:
